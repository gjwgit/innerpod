name: innerpod
version: '1.4.1'
summary: A session timer with session logged to your Solid Pod
description: |
  A session timer typically used for silent meditation.

base: core22
grade: stable
confinement: strict

apps:
  innerpod:
    command: innerpod
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - network
      - home

parts:
  innerpod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - clang
      - cmake
      - ninja-build
      - libgtk-3-dev
      - libblkid-dev
      - liblzma-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer-plugins-good1.0-dev
    stage-packages:
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgstreamer-plugins-good1.0-0
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-base

plugs:
  - audio-playback
  - pulseaudio
