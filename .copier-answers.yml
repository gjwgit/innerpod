_commit: v0.8.0
_src_path: gh:gjwgit/fluttertmpl
kind: app
android: true
app: innerpod
owner: gjwgit
copyright: 2026, Togaware Pty Ltd
publisher: Togaware Pty Ltd
name: InnerPod
summary: A privacy-first meditation timer
comment: You can optionally store logs securely and privately on your Solid Pod
categories:
- Utility
- Clock
keywords:
- meditation
- timer
- session
- bell
- solid
- pod
build: {}
deb:
  section: utils
snap:
  plugs:
  - audio-playback
  - network-bind
  - pulseaudio
  - screen-inhibit-control
  stage-packages:
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - libgstreamer-plugins-base1.0-0
  - libgstreamer-plugins-good1.0-0
  - libgstreamer1.0-0
flatpak:
  finish-args:
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.ScreenSaver
  icon: installers/icon_square.png
windows:
  appid: e847c732-5892-4b4c-bf15-80b4bfd0f0c2
install:
  folder: /var/www/html/web/installers/
  host: solidcommunity.au
  prod: true
  url: https://solidcommunity.au/installers/
stores:
  play: true
  snap: true
description: |
  InnerPod is a session timer typically used for silent meditation.
  Choose a length and a bell. The bell marks the start and the end
  of the session. A guided session is also available with a spoken
  word introduction.

  Sessions can be logged locally. On your say so, the log can instead
  be encrypted and stored on your own Solid Pod, so nobody, not even
  the server administrator, can see them. If you choose not to share
  the log on your Solid Pod then the timer simply runs and nothing is
  sent anywhere.
