name: innerpod
description: "A session timer with session logged to your Solid Pod."
publish_to: "none"
version: 2.0.12+99

environment:
  sdk: ">=3.2.5 <4.0.0"

# To automatically upgrade package dependencies:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated
#
# (gjw 20250722)

dependencies:
  audioplayers: ^6.1.0
  circular_countdown_timer: ^0.2.3
  cupertino_icons: ^1.0.2
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  google_fonts: ^8.0.2
  intl: ^0.20.2
  markdown_tooltip: ^0.0.7
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.4
  solidpod: ^1.0.21
  solidui: ^1.0.39
  url_launcher: ^6.3.0
  wakelock_plus: ^1.1.4

# 20260911 gjw TEMPORARY. The published solidpod and solid_auth clear the
# session on every start, so the login page always appears — see
# anusii/solidpod#717 and anusii/solid_auth#53. These overrides pick up the
# fixes from the GitHub fix branches. Remove this section once both are
# released.

dependency_overrides:
  solid_auth:
    git:
      url: https://github.com/anusii/solid_auth.git
      ref: gjw/52_secure_token_store
  solidpod:
    git:
      url: https://github.com/anusii/solidpod.git
      ref: gjw/716_single_flight_session_restore

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: any
  ubuntu_lints: any
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/app_icon.png
    - assets/images/app_image.jpg
    - assets/sounds/bell_bowl.mp3
    - assets/sounds/bell_cup.mp3
    - assets/sounds/bell_deep.mp3
    - assets/sounds/bell_original.mp3
    - assets/sounds/bell_small_bowl.mp3
    - assets/sounds/bell_temple.mp3
    - assets/sounds/intro.mp3
    - assets/sounds/session_guide.mp3
    - assets/sounds/session_outro.mp3
  uses-material-design: true

# Define launcher icons for all platforms (except Linux) so icons for
# the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`
#
# (gjw 20250429)

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21  ios: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    # background_color: "#hexcode"
    # theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
